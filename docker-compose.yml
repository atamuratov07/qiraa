services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: qiraa
      POSTGRES_PASSWORD: qiraa
      POSTGRES_DB: qiraa
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "qiraa", "-d", "qiraa"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres:
